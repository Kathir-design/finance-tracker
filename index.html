<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Finance Tracker</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

<h1>Finance Tracker</h1>

<!-- LOGIN -->
<div id="loginSection">
    <h2>Login</h2>
    <input id="username" placeholder="Username">
    <button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="appSection" style="display:none;">

    <h2>EMI Management</h2>
    <table id="emiTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>EMI</th>
                <th>Tenure</th>
                <th>Paid</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <button onclick="addEMI()">Add EMI</button>

    <h2>Personal Expenses</h2>
    <table id="expenseTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <button onclick="addExpense()">Add Expense</button>

    <h2>Monthly Tracker</h2>
    <table id="monthTable">
        <thead>
            <tr>
                <th>Month</th>
                <th>Income</th>
                <th>Net</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <h2>Dashboard</h2>
    <div class="charts">
        <canvas id="expenseChart"></canvas>
        <canvas id="debtChart"></canvas>
    </div>

</div>

</div>

<script src="app.js"></script>
</body>
</html>
